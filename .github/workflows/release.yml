name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # commit version bumps, push tags, create GitHub releases
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # With pending changesets: opens/updates the "Version Packages" PR.
      # After that PR is merged: publishes the new version to npm.
      - uses: changesets/action@v2
        with:
          publish-script: pnpm run release
        env:
          # Read by the .npmrc that setup-node writes for registry-url.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # pnpm reads PNPM_CONFIG_*, not NPM_CONFIG_*.
          PNPM_CONFIG_PROVENANCE: true
